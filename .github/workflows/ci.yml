---

name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master
      - develop
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-15-intel]
        python:
          - 3.8
          - 3.9
          - '3.10'
          - '3.11'
          - '3.12'

    name: "Python ${{ matrix.python }} • ${{ matrix.runs-on }} • x64 ${{ matrix.args }}"
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v3

      - name: Get history and tags for SCM versioning to work
        if: ${{ !env.ACT }}
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Install Python runtime library (macOS)
        if: runner.os == 'macOS'
        run: brew install gettext

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            setup.cfg
            pyproject.toml

      - name: Prepare env
        run: |
          python -m pip install -U "setuptools>=61.0.0"

      - name: Generate requirement file (Unix)
        if: runner.os != 'Windows'
        run: |
          python setup.py gen_reqfile --include-extras=test,azure-quantum,braket,revkit

      - name: Generate requirement file (Windows)
        if: runner.os == 'Windows'
        run: |
          python setup.py gen_reqfile --include-extras=test,azure-quantum,braket

      - name: Install build tools
        run: |
          python -m pip install -U pip setuptools wheel pybind11

      # RevKit's legacy build imports pybind11 without declaring it as a build dependency.
      - name: Build RevKit with preinstalled pybind11 (Unix)
        if: runner.os != 'Windows'
        run: python -m pip install --no-build-isolation 'revkit==3.0a2.dev2'

      - name: Install dependencies
        run: |
          cat requirements.txt
          python -m pip install -r requirements.txt --prefer-binary
          python -m pip install coveralls

      - name: Setup annotations on Linux
        if: runner.os == 'Linux'
        run: python -m pip install pytest-github-actions-annotate-failures

      - name: Build and install package (Unix)
        if: runner.os != 'Windows'
        run: python -m pip install -ve .[azure-quantum,braket,revkit,test]

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -ve .[azure-quantum,braket,test]

      - name: Pytest
        run: |
          echo 'backend: Agg' > matplotlibrc
          python -m pytest -p no:warnings --cov=projectq

      - name: Coveralls.io
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: python-${{ matrix.python }}-${{ matrix.runs-on }}-x64
          COVERALLS_PARALLEL: true

  finish:
    needs: standard
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Coveralls Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clang:
          - 11
          - latest
    env:
      CC: clang
      CXX: clang++
      PROJECTQ_CLEANUP_COMPILER_FLAGS: ${{ (matrix.clang <= 10) && 1 || 0 }}

    name: "Python 3 • Clang ${{ matrix.clang }} • x64"
    container: "silkeh/clang:${{ matrix.clang == 11 && '11-bullseye' || matrix.clang }}"

    steps:
      # Bullseye security packages have left the live mirrors; keep this legacy toolchain reproducible.
      - name: Refresh Debian repository URLs
        run: |
          find /etc/apt -name '*.list' -exec sed -i \
            -e 's|^deb http://deb.debian.org/debian-security bullseye-security|deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260801T000000Z bullseye-security|' \
            -e 's|http://deb.debian.org/debian|https://deb.debian.org/debian|g' {} +

      - name: Install Git
        run: |
          apt-get update && apt-get install -y git --no-install-recommends

      # Work-around for https://github.com/actions/runner-images/issues/6775
      - name: Change Owner of Container Working Directory
        run: chown root:root .

      - uses: actions/checkout@v3

      - name: Get history and tags for SCM versioning to work
        if: ${{ !env.ACT }}
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Prepare env
        run: >
          apt-get update && apt-get install -y python3-dev python3-pip python3-setuptools python3-wheel
          python3-numpy python3-scipy python3-matplotlib python3-requests python3-networkx
          python3-pytest python3-pytest-cov python3-flaky python3-venv
          --no-install-recommends

      - name: Prepare Python env
        run: |
          python3 -m venv venv
          ./venv/bin/python3 -m pip install -U pip setuptools wheel
          ./venv/bin/python3 setup.py gen_reqfile --include-extras=test,azure-quantum,braket
          cat requirements.txt
          ./venv/bin/python3 -m pip install -r requirements.txt --prefer-binary

      - name: Upgrade pybind11 and flaky
        run: ./venv/bin/python3 -m pip install --upgrade pybind11 flaky --prefer-binary

      - name: Build and install package
        run: ./venv/bin/python3 -m pip install -ve .[azure-quantum,braket,test]

      - name: Pytest
        run: |
          echo 'backend: Agg' > matplotlibrc
          ./venv/bin/python3 -m pytest -p no:warnings


  gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc:
          - 9
          - latest

    name: "Python 3 • GCC ${{ matrix.gcc }} • x64"
    container: "gcc:${{ matrix.gcc }}"

    steps:
      # Bullseye security packages have left the live mirrors; keep this legacy toolchain reproducible.
      - name: Refresh Debian repository URLs
        run: |
          find /etc/apt -name '*.list' -exec sed -i \
            -e 's|^deb http://deb.debian.org/debian-security bullseye-security|deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260801T000000Z bullseye-security|' \
            -e 's|http://deb.debian.org/debian|https://deb.debian.org/debian|g' {} +

      - uses: actions/checkout@v3

      # Work-around for https://github.com/actions/runner-images/issues/6775
      - name: Change Owner of Container Working Directory
        run: chown root:root .

      - name: Get history and tags for SCM versioning to work
        if: ${{ !env.ACT }}
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Prepare env
        run: >
          apt-get update && apt-get install -y python3-dev python3-pip python3-setuptools python3-wheel
          python3-numpy python3-scipy python3-matplotlib python3-requests python3-networkx
          python3-pytest python3-pytest-cov python3-flaky python3-venv
          --no-install-recommends

      - name: Prepare Python env
        run: |
          python3 -m venv venv
          ./venv/bin/python3 -m pip install -U pip setuptools wheel
          ./venv/bin/python3 setup.py gen_reqfile --include-extras=test,azure-quantum,braket
          cat requirements.txt
          ./venv/bin/python3 -m pip install -r requirements.txt --prefer-binary

      - name: Upgrade pybind11 and flaky
        run: ./venv/bin/python3 -m pip install --upgrade pybind11 flaky --prefer-binary

      - name: Build and install package
        run: ./venv/bin/python3 -m pip install -ve .[azure-quantum,braket,test]

      - name: Pytest
        run: |
          echo 'backend: Agg' > matplotlibrc
          ./venv/bin/python3 -m pytest -p no:warnings


  # Keep JavaScript actions on the host: Node 24 cannot run on CentOS 7's glibc.
  # Build and test in the original containers to retain the older compiler coverage.
  centos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        centos: [7, 8]
    name: "Python 3 • CentOS ${{ matrix.centos }} • x64"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build and test in CentOS
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CENTOS_VERSION=${{ matrix.centos }} \
            centos:${{ matrix.centos }} bash .github/scripts/ci-centos.sh


  documentation:
    name: "Documentation build test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get history and tags for SCM versioning to work
        if: ${{ !env.ACT }}
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            setup.cfg
            pyproject.toml

      - name: Install docs & setup requirements
        run: |
          python3 -m pip install .[docs]

      - name: Build docs
        run: python3 -m sphinx -b html docs docs/.build

      # NB: disabling until setup.py is updated to remove any mention of distutils
      # - name: Make SDist
      #  run: python3 setup.py sdist
