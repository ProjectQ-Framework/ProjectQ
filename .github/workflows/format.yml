---

name: Format

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master
      - stable
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    container: silkeh/clang:14
    env:
      CC: clang
      CXX: clang++

    steps:
      # Bullseye security packages have left the live mirrors; keep this legacy toolchain reproducible.
      - name: Refresh Debian repository URLs
        run: |
          find /etc/apt -name '*.list' -exec sed -i \
            -e 's|^deb http://deb.debian.org/debian-security bullseye-security|deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260801T000000Z bullseye-security|' \
            -e 's|http://deb.debian.org/debian|https://deb.debian.org/debian|g' {} +

      - uses: actions/checkout@v3

      - name: Prepare env
        run: >
          apt-get update && apt-get install -y python3-dev python3-pip python3-setuptools python3-wheel
          --no-install-recommends

      - name: Upgrade pybind11 and setuptools
        run: python3 -m pip install --upgrade pybind11 "setuptools>=61.0.0" --prefer-binary

      - name: Run clang-tidy
        run: python3 setup.py clang_tidy --warning-as-errors
